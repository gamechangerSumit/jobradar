server:
  port: 8080
spring:
  application:
    name: jobradar-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobradar}
    username: ${SPRING_DATASOURCE_USERNAME:jobradar}
    password: ${SPRING_DATASOURCE_PASSWORD:jobradar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
jobradar:
  cors:
    allowed-origins: ${JOBRADAR_CORS_ORIGINS:http://localhost:5173}
  collection:
    interval-ms: ${JOBRADAR_COLLECTION_INTERVAL_MS:3600000}
    initial-delay-ms: ${JOBRADAR_COLLECTION_INITIAL_DELAY_MS:30000}
  sources:
    adzuna:
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
      country: ${ADZUNA_COUNTRY:in}
      city: ${ADZUNA_CITY:Pune}
      radius-km: ${ADZUNA_RADIUS_KM:25}
