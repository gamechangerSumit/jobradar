services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobradar} -d ${POSTGRES_DB:-jobradar}"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jobradar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-jobradar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      JOBRADAR_CORS_ORIGINS: http://localhost:5173,http://localhost:8081
      ADZUNA_ENABLED: ${ADZUNA_ENABLED:-false}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_COUNTRY: ${ADZUNA_COUNTRY:-in}
      ADZUNA_CITY: ${ADZUNA_CITY:-Pune}
      ADZUNA_RADIUS_KM: ${ADZUNA_RADIUS_KM:-25}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8081:80"]
    depends_on: [backend]
volumes:
  postgres_data:
